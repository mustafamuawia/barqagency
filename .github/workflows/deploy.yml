name: Deploy Barq Agency

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/barqagency
            git pull origin main

            # Backend setup
            cd /var/www/barqagency/backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Permissions
            chown -R www-data:www-data /var/www/barqagency
            chmod -R 775 /var/www/barqagency/backend/storage /var/www/barqagency/backend/bootstrap/cache
